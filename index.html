<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b63">
<title>RegistraObra</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="lock" class="lock hidden">
  <div class="lock-card">
    <h1>RegistraObra</h1>
    <p>Ingrese su clave</p>
    <input id="lockPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
    <button id="lockBtn" class="btn primary">Ingresar</button>
    <p id="lockMsg" class="msg err"></p>
  </div>
</div>

<header class="top no-print">
  <div class="top-row">
    <div>
      <div class="brand"><img src="icon-192.png" alt="" class="logo">REGISTRAOBRA</div>
      <div id="subtitle" class="sub">Parque Pampahuasi</div>
    </div>
    <span id="netBadge" class="badge off">Sin conexión</span>
  </div>
  <div class="top-row small">
    <span id="pendingTxt">0 registros pendientes de sincronizar</span>
    <button id="syncBtn" class="btn ghost sm">Sincronizar</button>
  </div>
</header>

<main id="view" class="no-print"></main>
<div id="printArea"></div>
<div id="toast" class="toast hidden"></div>

<nav class="bottom no-print">
  <button data-go="inicio" class="nv-inicio"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Inicio</button>
  <button data-go="asistencia" class="nv-asistencia"><span class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M8.5 13l2.5 2.5 4.5-5"/></svg></span>Asistencia</button>
  <button data-go="ssoma" class="nv-ssoma"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M2.5 16h19v2.5h-19z"/><path d="M12 8v5M9 9.5l1 3.5M15 9.5l-1 3.5"/></svg></span>SSOMA</button>
  <button data-go="agua" class="nv-agua"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3c3.5 4.5 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.5-6.5 6-11z"/><path d="M9.5 15a2.5 2.5 0 0 0 2.5 2.5"/></svg></span>Agua</button>
  <button data-go="expediente" class="nv-expediente"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg></span>Expediente</button>
  <button data-go="mas" class="nv-mas"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span>Más</button>
</nav>

<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
